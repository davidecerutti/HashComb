name: Mirror Repository to Local GitLab

on:
  push:
    branches:
      - '*'
    tags:
      - '*'

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to local GitLab
        env:
          TARGET_URL: "https://${{ secrets.GITLAB_USERNAME }}:${{ secrets.GITLAB_TOKEN }}@repository.ricerca.sesar.di.unimi.it/davide/hashcomb"
        run: |
          git remote add mirror "$TARGET_URL"
          git push mirror --mirror
